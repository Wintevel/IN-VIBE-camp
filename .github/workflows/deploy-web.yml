name: 웹 미리보기 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web
      # 새로고침·직접 주소 진입 대비, 그리고 _expo 폴더가 Jekyll 에 걸러지지 않게 함
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      # 제휴업체용 웹(web/)을 같은 사이트의 /partner/ 아래에 함께 올립니다
      - run: npm ci && npm run build && cp -r dist ../frontend/dist/partner
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
