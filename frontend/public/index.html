<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: 홈 화면 설치용. 주소가 /IN-VIBE-camp/ 아래라서 절대 경로로 씁니다(404.html 로 깊은 주소에 들어와도 같게). -->
    <link rel="manifest" href="/IN-VIBE-camp/manifest.webmanifest" />
    <meta name="theme-color" content="#E4E9F2" />
    <link rel="apple-touch-icon" href="/IN-VIBE-camp/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="집게표" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background: #E4E9F2;
        overscroll-behavior: none; /* 끝까지 스크롤했을 때 페이지가 출렁이지 않게 */
        -webkit-tap-highlight-color: transparent; /* 폰에서 누를 때 생기는 회색 네모 제거(앱 쪽 눌림 효과가 대신함) */
        -webkit-font-smoothing: antialiased;
      }
      [role='button'], button, a {
        touch-action: manipulation; /* 두 번 탭 확대 지연 없이 바로 반응 */
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // 서비스 워커: 앱 셸 캐시. https 또는 localhost 에서만 동작합니다.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/IN-VIBE-camp/sw.js', { scope: '/IN-VIBE-camp/' }).catch(function () {})
        })
      }
    </script>
  </body>
</html>
